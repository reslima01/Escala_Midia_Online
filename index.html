<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala do Ministério de Mídia</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<!-- Biblioteca para gerar imagem -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<div class="container print-container" id="content-to-print">

<div class="header">

<div id="logo-container" class="flex flex-col items-center mb-4">
<div id="logo-placeholder" class="logo-placeholder cursor-pointer no-print">
🎥
</div>

<img id="logo-image" src="" class="max-w-full max-h-32 object-contain hidden">

<input type="file" id="logo-input" accept="image/*" class="hidden no-print">

<p class="text-sm text-[#f17c37] mt-2 no-print">
Clique para adicionar logo
</p>
</div>

<h1 class="text-3xl font-bold text-white">
Escala Ministério de Mídia
</h1>

<h2 class="text-xl mt-1 text-white" id="month-year-title"></h2>

</div>

<!-- Seleção mês e ano -->

<div class="flex justify-center items-center gap-4 mb-4 no-print">

<select id="month-select" class="rounded-lg p-2 bg-slate-100 text-slate-800 border-2 border-[#f17c37]">

<option value="0">Janeiro</option>
<option value="1">Fevereiro</option>
<option value="2">Março</option>
<option value="3">Abril</option>
<option value="4">Maio</option>
<option value="5">Junho</option>
<option value="6">Julho</option>
<option value="7">Agosto</option>
<option value="8">Setembro</option>
<option value="9">Outubro</option>
<option value="10">Novembro</option>
<option value="11">Dezembro</option>

</select>

<input type="number" id="year-input"
class="rounded-lg p-2 w-24 text-center bg-slate-100 text-slate-800 border-2 border-[#f17c37]">

</div>

<div id="schedule-container" class="space-y-6"></div>

<div class="flex flex-col items-center gap-3 no-print">

<select id="format-select"
class="rounded-lg p-2 w-full bg-slate-100 text-slate-800 border-2 border-[#f17c37]">

<option value="story">Story</option>
<option value="a4">A4</option>

</select>

<button id="add-date-button" class="button">
Adicionar Nova Data
</button>

<button id="generate-image-button" class="button">
Gerar Imagem
</button>

<div id="message" class="message-box"></div>

</div>

</div>

<!-- JS -->
<script src="main.js"></script>

</body>
</html>
