<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala do Ministério de Mídia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #7d9b89 0%, #6e8d7c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background: linear-gradient(135deg, #7d9b89 0%, #6e8d7c 100%);
            border-radius: 1rem;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            color: #f8fafc;
            max-width: 600px;
            width: 100%;
        }
        .header {
            border-bottom: 2px solid #f17c37;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .schedule-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background-color: #344955;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border-left: 4px solid #f17c37;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .date-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f17c37;
            margin-bottom: 1rem;
        }
        .function-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.25rem;
        }
        .function-label {
            width: 30%;
            font-weight: 600;
            color: #f17c37;
        }
        .person-name {
            width: 70%;
            background-color: #f1f5f9;
            padding: 0.22rem 0.5rem;
            border-radius: 0.360rem;
            outline: none;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid #d1d5db;
            font-weight: bold;
            color: #334155;
        }
        .person-name:hover, .person-name:focus {
            background-color: #f9fafb;
            border-color: #f17c37;
        }
        .button {
            background-color: #f17c37;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1.5rem;
            width: 100%;
            text-align: center;
            border: none;
        }
        .button:hover {
            background-color: #ea580c;
        }
        .message-box {
            background-color: #f17c37;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-align: center;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .logo-placeholder {
            width: 128px;
            height: 128px;
            background: linear-gradient(135deg, #f17c37, #f99f57);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto 1rem;
        }
        
        .print-container {
            position: relative;
            background: linear-gradient(135deg, #7d9b89 0%, #6e8d7c 100%);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            color: #f8fafc;
        }
        
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #f1f5f9 !important;
            }
            .container {
                background: #f1f5f9 !important;
                color: black !important;
                box-shadow: none !important;
            }
            .schedule-item {
                background-color: #e2e8f0 !important;
                color: black !important;
            }
            .date-header {
                color: black !important;
            }
            .function-label {
                color: #333 !important;
            }
            .person-name {
                background-color: #e2e8f0 !important;
                color: black !important;
                border: 1px solid #ccc !important;
            }
            #logo-container {
                display: block !important;
            }
            #logo-image {
                display: block !important;
                margin: 0 auto;
                max-width: 100% !important;
                max-height: 150px !important;
                object-fit: contain;
            }
            .header h2 {
                color: black !important;
            }
        }
    </style>
    <!-- Incluindo as bibliotecas para gerar a imagem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container print-container" id="content-to-print">
    <div class="header">
        <!-- Logo da igreja -->
        <div id="logo-container" class="flex flex-col items-center mb-4">
            <div id="logo-placeholder" class="logo-placeholder cursor-pointer no-print" onclick="document.getElementById('logo-input').click()">
                🎥
            </div>
            <img id="logo-image" src="" alt="Logo da Igreja" class="max-w-full max-h-32 object-contain hidden">
            <input type="file" id="logo-input" accept="image/*" class="hidden no-print">
            <p class="text-sm text-[#f17c37] mt-2 no-print">Clique para adicionar logo</p>
        </div>
        <h1 class="text-3xl font-bold text-white">Escala Ministério de Mídia</h1>
        <h2 class="text-xl mt-1 text-white" id="month-year-title"></h2>
    </div>

    <!-- Controles de Mês e Ano -->
    <div class="flex justify-center items-center gap-4 mb-4 no-print">
        <select id="month-select" class="rounded-lg p-2 bg-slate-100 text-slate-800 border-2 border-[#f17c37]">
            <option value="0">Janeiro</option>
            <option value="1">Fevereiro</option>
            <option value="2">Março</option>
            <option value="3">Abril</option>
            <option value="4">Maio</option>
            <option value="5">Junho</option>
            <option value="6">Julho</option>
            <option value="7">Agosto</option>
            <option value="8">Setembro</option>
            <option value="9">Outubro</option>
            <option value="10">Novembro</option>
            <option value="11">Dezembro</option>
        </select>
        <input type="number" id="year-input" class="rounded-lg p-2 w-24 text-center bg-slate-100 text-slate-800 border-2 border-[#f17c37]" min="2020">
    </div>

    <div id="schedule-container" class="space-y-6">
        <!-- Itens da escala serão inseridos aqui pelo JavaScript -->
    </div>

    <div class="flex flex-col items-center gap-3 no-print">
        <div class="flex items-center gap-2 w-full">
            <span class="text-sm text-gray-300">Formato:</span>
            <select id="format-select" class="rounded-lg p-2 w-full bg-slate-100 text-slate-800 border-2 border-[#f17c37]">
                <option value="story">Story</option>
                <option value="a4">A4</option>
            </select>
        </div>
        <button id="add-date-button" class="button">Adicionar Nova Data</button>
        <button id="generate-image-button" class="button">Gerar Imagem</button>
        <div id="message" class="message-box"></div>
    </div>
</div>

<script>
    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    let allDates = [];

    // Função para obter todos os dias de uma semana em um mês
    function getWeekDaysInMonth(year, month, dayOfWeek) {
        const dates = [];
        const date = new Date(year, month, 1);
        while (date.getMonth() === month) {
            if (date.getDay() === dayOfWeek) {
                dates.push(new Date(date));
            }
            date.setDate(date.getDate() + 1);
        }
        return dates;
    }

    // Função para formatar a data
    function formatDate(date) {
        const day = date.getDate().toString().padStart(2, '0');
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        return `${day}/${month}`;
    }

    // Função para obter o nome do dia da semana
    function getDayName(date) {
        const days = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
        return days[date.getDay()];
    }

    // Função para criar um item da escala
    function createScheduleItem(date, nomeEvento = '', mediaName = '', transmissionName = '',redeName= '', photoName = '') {
        const formattedDate = formatDate(date);
        const dayName = getDayName(date);
        
        return `
            <div class="schedule-item">
                <div class="date-header">${dayName} - ${formattedDate}</div>
                <div class="function-row">
                    <span class="function-label">Nome do Evento:</span>
                    <input type="text" class="person-name nome-evento" placeholder="Nome do Evento" value="${nomeEvento}">
                </div>
                <div class="function-row">
                    <span class="function-label">Mídia Culto:</span>
                    <input type="text" class="person-name media-culto" placeholder="Nome do responsável" value="${mediaName}">
                </div>
                <div class="function-row">
                    <span class="function-label">Transmissão:</span>
                    <input type="text" class="person-name transmissao" placeholder="Nome do responsável" value="${transmissionName}">
                </div>
                 <div class="function-row">
                    <span class="function-label">Rede Social:</span>
                    <input type="text" class="person-name rede-social" placeholder="Nome do responsável" value="${redeName}">
                </div>
                <div class="function-row">
                    <span class="function-label">Treinamento:</span>
                    <input type="text" class="person-name fotos" placeholder="Nome do responsável" value="${photoName}">
                </div>
            </div>
        `;
    }

    // Função para ordenar e renderizar todas as datas
    function sortAndRenderDates() {
        allDates.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        const container = document.getElementById('schedule-container');
        let scheduleHTML = '';
        
        allDates.forEach(dateObj => {
            scheduleHTML += createScheduleItem(dateObj.date,dateObj.nomeEvento ,dateObj.mediaName, dateObj.transmissionName, dateObj.redeName,dateObj.photoName);
        });
        
        container.innerHTML = scheduleHTML;
        
        // Adiciona event listeners para salvar ao digitar
        document.querySelectorAll('.person-name').forEach(input => {
            input.addEventListener('input', saveToCache);
        });
    }

    // Função para gerar a escala completa com base no mês e ano selecionados
    function generateSchedule() {
        const year = parseInt(document.getElementById('year-input').value);
        const month = parseInt(document.getElementById('month-select').value);

        if (isNaN(year) || isNaN(month)) return;
        
        // Atualiza o título
        const monthYearTitle = document.getElementById('month-year-title');
        monthYearTitle.textContent = `${monthNames[month]} ${year}`;
        
        const sundays = getWeekDaysInMonth(year, month, 0); // 0 = Domingo
        allDates = sundays.map(sunday => ({
            date: sunday,
            nomeEvento: '',
            mediaName: '',
            transmissionName: '',
            redeName: '',
            photoName: ''
        }));
        
        sortAndRenderDates();
        saveToCache();
    }

    // Função para carregar logo
    function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const logoImage = document.getElementById('logo-image');
                const logoPlaceholder = document.getElementById('logo-placeholder');
                
                logoImage.src = e.target.result;
                logoImage.classList.remove('hidden');
                logoPlaceholder.classList.add('hidden');
                saveToCache();
            };
            reader.readAsDataURL(file);
        }
    }

    // Função para adicionar nova data
    function addNewDate() {
        const messageBox = document.getElementById('message');
        const dateInput = prompt('Digite a nova data (DD/MM/AAAA):');
        if (dateInput) {
            const dateParts = dateInput.split('/');
            if (dateParts.length === 3) {
                const day = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]) - 1; // JavaScript months are 0-indexed
                const year = parseInt(dateParts[2]);
                
                if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                    const newDate = new Date(year, month, day);
                    
                    // Adicionar a nova data ao array
                    allDates.push({ date: newDate, nomeEvento: '', mediaName: '', transmissionName: '', redeName: '' , photoName: '' });
                    
                    // Reordenar e renderizar todas as datas
                    sortAndRenderDates();
                    saveToCache();
                    
                    messageBox.textContent = 'Nova data adicionada com sucesso!';
                    messageBox.style.backgroundColor = '#059669';
                    messageBox.style.opacity = '1';
                    setTimeout(() => {
                        messageBox.style.opacity = '0';
                    }, 2000);
                } else {
                    messageBox.textContent = 'Erro: Formato de data inválido. Use DD/MM/AAAA.';
                    messageBox.style.backgroundColor = '#dc2626';
                    messageBox.style.opacity = '1';
                    setTimeout(() => {
                        messageBox.style.opacity = '0';
                    }, 3000);
                }
            } else {
                messageBox.textContent = 'Erro: Formato de data inválido. Use DD/MM/AAAA.';
                messageBox.style.backgroundColor = '#dc2626';
                messageBox.style.opacity = '1';
                setTimeout(() => {
                    messageBox.style.opacity = '0';
                    }, 3000);
                }
            }
        }

    // Função para salvar dados no cache do navegador
    function saveToCache() {
        const scheduleItems = document.querySelectorAll('.schedule-item');
        const savedData = allDates.map((dateObj, index) => {
            const names = scheduleItems[index].querySelectorAll('.person-name');
            return {
                date: dateObj.date,
                nomeEvento: names[0] ? names[0].value : '',
                mediaName: names[1] ? names[1].value : '',
                transmissionName: names[2] ? names[2].value : '',
                redeName: names[3] ? names[3].value : '',
                photoName: names[4] ? names[4].value : ''
            };
        });

        const logoImage = document.getElementById('logo-image');
        const logoSrc = logoImage.src.startsWith('data:') ? logoImage.src : '';

        const cacheData = {
            month: document.getElementById('month-select').value,
            year: document.getElementById('year-input').value,
            schedule: savedData,
            logo: logoSrc
        };

        localStorage.setItem('mediaSchedule', JSON.stringify(cacheData));
    }

    // Função para carregar dados do cache do navegador
    function loadFromCache() {
        const cachedData = localStorage.getItem('mediaSchedule');
        if (cachedData) {
            const data = JSON.parse(cachedData);
            
            document.getElementById('month-select').value = data.month;
            document.getElementById('year-input').value = data.year;

            allDates = data.schedule.map(item => ({
                date: new Date(item.date),
                nomeEvento: item.nomeEvento,
                mediaName: item.mediaName,
                transmissionName: item.transmissionName,
                redeName: item.redeName,
                photoName: item.photoName
            }));
            
            sortAndRenderDates();
            generateScheduleHeader(data.month, data.year);

            const logoImage = document.getElementById('logo-image');
            const logoPlaceholder = document.getElementById('logo-placeholder');
            if (data.logo) {
                logoImage.src = data.logo;
                logoImage.classList.remove('hidden');
                logoPlaceholder.classList.add('hidden');
            }
        }
    }

    // Função para gerar a imagem
    async function generateImage() {
        const message = document.getElementById('message');
        const noPrintElements = document.querySelectorAll('.no-print');
        const contentToPrint = document.getElementById('content-to-print');
        const formatSelect = document.getElementById('format-select');
        const selectedFormat = formatSelect.value;
        const originalStyles = {
            width: contentToPrint.style.width,
            maxWidth: contentToPrint.style.maxWidth,
            padding: contentToPrint.style.padding,
            flexDirection: contentToPrint.style.flexDirection,
            justifyContent: contentToPrint.style.justifyContent,
            alignItems: contentToPrint.style.alignItems,
            background: document.body.style.background,
        };

        try {
            message.textContent = 'Gerando imagem...';
            message.style.backgroundColor = '#2563eb';
            message.style.opacity = '1';

            noPrintElements.forEach(el => el.style.display = 'none');

            if (selectedFormat === 'story') {
                contentToPrint.style.width = '375px';
                contentToPrint.style.maxWidth = '375px';
                contentToPrint.style.padding = '1.5rem 1rem';
                contentToPrint.style.flexDirection = 'column';
                contentToPrint.style.justifyContent = 'flex-start';
                contentToPrint.style.alignItems = 'center';
            } else if (selectedFormat === 'a4') {
                contentToPrint.style.width = '794px';
                contentToPrint.style.maxWidth = '794px';
                contentToPrint.style.padding = '4rem';
                contentToPrint.style.flexDirection = '';
                contentToPrint.style.justifyContent = '';
                contentToPrint.style.alignItems = '';
            }
            
            await new Promise(resolve => setTimeout(resolve, 50));

            const canvas = await html2canvas(contentToPrint, {
                scale: 2,
                useCORS: true,
                logging: false,
            });

            const imageURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = imageURL;
            link.download = `escala-ministerio-midia-${selectedFormat}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            message.textContent = 'Imagem gerada e baixada!';
            message.style.backgroundColor = '#059669';
            setTimeout(() => {
                message.style.opacity = '0';
            }, 3000);

        } catch (error) {
            console.error("Erro ao gerar imagem:", error);
            message.textContent = 'Erro ao gerar imagem.';
            message.style.backgroundColor = '#dc2626';
            setTimeout(() => {
                message.style.opacity = '0';
            }, 3000);
        } finally {
            noPrintElements.forEach(el => el.style.display = '');
            contentToPrint.style.width = originalStyles.width;
            contentToPrint.style.maxWidth = originalStyles.maxWidth;
            contentToPrint.style.padding = originalStyles.padding;
            contentToPrint.style.flexDirection = originalStyles.flexDirection;
            contentToPrint.style.justifyContent = originalStyles.justifyContent;
            contentToPrint.style.alignItems = originalStyles.alignItems;
            document.body.style.background = originalStyles.background;
        }
    }

    function generateScheduleHeader(month, year) {
        const monthYearTitle = document.getElementById('month-year-title');
        monthYearTitle.textContent = `${monthNames[month]} ${year}`;
    }

    // Inicializar a aplicação
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        const monthSelect = document.getElementById('month-select');
        const yearInput = document.getElementById('year-input');

        if (!localStorage.getItem('mediaSchedule')) {
            monthSelect.value = today.getMonth();
            yearInput.value = today.getFullYear();
            generateSchedule();
        } else {
            loadFromCache();
        }
        
        monthSelect.addEventListener('change', generateSchedule);
        yearInput.addEventListener('change', generateSchedule);
        
        document.getElementById('logo-input').addEventListener('change', handleLogoUpload);
        document.getElementById('add-date-button').addEventListener('click', addNewDate);
        document.getElementById('generate-image-button').addEventListener('click', generateImage);
    });
</script>

</body>
</html>
